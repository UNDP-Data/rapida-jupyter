name: Build docker image

on:
  push:
    branches:
      - "main"  # Runs only when a PR is merged into main

jobs:

  build-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    outputs:
      # Export the discovered core version to the deployment jobs below
      base_version: ${{ steps.get-version.outputs.version }}
    env:
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      # ==========================================================
      # NATIVE & SECURE: Fetch latest Release via GitHub CLI
      # ==========================================================
      - name: Get latest release version from core rapida
        id: get-version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Use type/command checks to prevent exit code 127 locally
          if command -v gh &> /dev/null; then
            TAG=$(gh release view --repo UNDP-Data/rapida --json tagName --jq '.tagName' 2>/dev/null || echo "1.0.8")
          else
            echo "gh CLI not found (Local act environment). Using fallback."
            TAG="0.0.0.act"
          fi
          
          # Strip leading 'v' if present (e.g., v2026.05.01 -> 2026.05.01)
          VERSION=$(echo "$TAG" | sed 's/^v//')
          
          # Fallback to timestamp if the repository doesn't have an active release yet
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            VERSION=$(date +'%Y.%m.%d-%H%M')
          fi
          
          echo "Found core rapida release version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.get-version.outputs.version }}
            type=raw,value=latest

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PRODUCTION=true
          outputs: type=docker,dest=${{ runner.temp }}/myimage.tar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: myimage
          path: ${{ runner.temp }}/myimage.tar

  deploy-acr:
    name: Deploy to Azure Container Registry
    needs: build-image
    runs-on: ubuntu-latest
    environment:
      name: azure container registry
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: myimage
        path: ${{ runner.temp }}

    - name: Load image
      run: |
        docker load --input ${{ runner.temp }}/myimage.tar

    - name: Extract ACR metadata
      id: acr-meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ secrets.ACR_ENDPOINT }}/${{ github.repository }}
        tags: |
          type=raw,value=${{ needs.build-image.outputs.base_version }}
          type=raw,value=latest

    - name: Log into ACR
      uses: docker/login-action@v3
      with:
        registry: ${{ secrets.ACR_ENDPOINT }}
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    - name: Tag and push to ACR
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile
        tags: ${{ steps.acr-meta.outputs.tags }}
        labels: ${{ steps.acr-meta.outputs.labels }}
        push: true

  deploy-github:
    name: Deploy to GitHub Container Registry
    needs: build-image
    runs-on: ubuntu-latest
    environment:
      name: github container registry
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: myimage
          path: ${{ runner.temp }}

      - name: Load image
        run: |
          docker load --input ${{ runner.temp }}/myimage.tar

      - name: Extract GHCR metadata
        id: ghcr-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.build-image.outputs.base_version }}
            type=raw,value=latest

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          tags: ${{ steps.ghcr-meta.outputs.tags }}
          labels: ${{ steps.ghcr-meta.outputs.labels }}
          push: true

  create-release:
    name: Create GitHub Release
    needs: [ build-image, deploy-acr, deploy-github ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate or Update Release Notes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build-image.outputs.base_version }}
          generate_release_notes: true
          # ==========================================================
          # THE FIX: Prevent crashes if the version hasn't bumped yet
          # ==========================================================
          allowUpdates: true